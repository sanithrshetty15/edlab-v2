# Edwins Lab - Render Deployment Configuration
# ==============================================
# Dockerfile lives in backend/ and is built with backend/ as the context.
# Set all `sync: false` values in the Render dashboard before deploying.

services:
  - type: web
    name: edwinslab-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
        # Set this to the new deployment database. Do not point the upgraded
        # backend at the old database during cutover.
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ONE_PASSWORD
        sync: false
      - key: ADMIN_TWO_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GMAIL_USERNAME
        value: edwin.lab.aiet@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAILER_FROM
        value: Edwins Lab <edwin.lab.aiet@gmail.com>
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_REDIRECT_URL
        value: https://edwinslab.onrender.com/api/v1/oauth/google/callback
      - key: RATE_LIMIT_REQUESTS
        value: 100
      - key: RATE_LIMIT_PERIOD_SECONDS
        value: 60
      - key: SESSION_TTL_SECONDS
        value: 86400
