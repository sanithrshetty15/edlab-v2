
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: edwinslab_development
  username: edwinslab

test:
  <<: *default
  database: edwinslab_test
  username: edwinslab

production:
  primary:
    <<: *default
    schema_search_path: public
    migrations_paths: db/migrate
    schema_dump: db/schema.rb

  cache:
    <<: *default
    schema_search_path: solid_cache
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb

  queue:
    <<: *default
    schema_search_path: solid_queue
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb

  cable:
    <<: *default
    schema_search_path: solid_cable
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb
