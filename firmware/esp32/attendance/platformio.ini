[platformio]
default_envs = esp32dev
; Modular attendance firmware. It is a separate project from the door-lock
; sketch and shares no build artifacts or source with it.
src_dir = src

[env:esp32dev]
; ESP32-WROOM-32UE on the ALF V1.0 attendance PCB. The PlatformIO esp32dev
; board definition is the correct generic 4 MB / no-PSRAM target.
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DATTENDANCE_LOG_LEVEL=2
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++17
    -Iinclude
