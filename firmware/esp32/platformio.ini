[platformio]
default_envs = esp32dev
; The whole firmware is one Arduino IDE sketch: firmware/esp32/doorlock/doorlock.ino
; The sketch folder name must match the .ino name so the same file can be
; opened and uploaded directly from the Arduino IDE.
src_dir = doorlock

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DARDUINO_LOOP_STACK_SIZE=16384

; WiFi, HTTPClient and Preferences ship with the ESP32 Arduino core.
; ArduinoJson is the only external library the sketch needs.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
