[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Adafruit Fingerprint Sensor Library is kept as the reference R307S/R30x
; driver dependency. The firmware also ships a dependency-free R307S driver
; under src/ and does not require this library at compile time.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.4
